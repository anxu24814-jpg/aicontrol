<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F7F9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI Control" />
    <meta name="description" content="在浏览器里查看并继续手机上的会话" />
    <link rel="manifest" href="./app-manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- 资产相对引用锚到站点根：/c/:id 深链由 SPA fallback 供 index.html 时仍能解析 assets -->
    <base href="/" />
    <title>AI Control 网页遥控</title>
    <!-- 主题首帧防闪：cookie 记忆优先，其次系统偏好；缺省浅色 -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)aicontrol_theme=([^;]+)/);
          var mode = m ? decodeURIComponent(m[1]) : 'auto';
          var dark = mode === 'dark' || (mode !== 'light'
            && window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) { meta.setAttribute('content', dark ? '#141416' : '#F7F7F9'); }
        } catch (e) {
          /* 首帧主题失败不影响连接 */
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-oCZp0TMM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bpc29QD_.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
